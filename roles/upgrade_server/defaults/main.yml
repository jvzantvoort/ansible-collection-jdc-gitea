---
# Path to the gitea binary, config, and working directory (must match the
# running installation).
gitea_bin: /usr/local/bin/gitea
gitea_home: /var/lib/gitea
gitea_conf: /etc/gitea/app.ini

# OS user gitea runs as.
gitea_user: git

# Release architecture as published on dl.gitea.com.
gitea_arch: linux-amd64

# Version to install. "latest" resolves against dl.gitea.com/gitea/version.json.
gitea_version: latest

# Extra arguments passed to `gitea dump` (see `gitea dump --help`).
gitea_dump_opts: ""

# Verify the release's detached GPG signature in addition to its sha256 sum.
gitea_verify_gpg: true
gitea_gpg_fingerprint: "7C9E68152594688862D62AF62D9AE806EC1592E2"

# Name of the systemd unit (ignored on OpenWrt, which uses /etc/init.d/gitea).
gitea_service_name: gitea

# Scratch directory used to stage the downloaded release.
gitea_download_tmp: /tmp/gitea-upgrade

# Privilege escalation used to run commands as gitea_user. On OpenWrt this is
# forced to "su" to match the target's lack of sudo.
gitea_become_method: sudo
